[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grass-editor"
dynamic = ["version"]
description = "A calm, zero-config terminal code editor."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mukund Jha" }]
keywords = ["editor", "terminal", "tui", "curses", "text-editor", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Editors",
    "Topic :: Text Editors :: Text Processing",
]
dependencies = ["pygments>=2.6"]

[project.urls]
Homepage = "https://github.com/mukundzha/grass"
Repository = "https://github.com/mukundzha/grass"
Issues = "https://github.com/mukundzha/grass/issues"

[project.scripts]
grass = "grass.main:main"

[tool.setuptools.dynamic]
version = { attr = "grass.VERSION" }

[tool.setuptools.packages.find]
include = ["grass*"]
